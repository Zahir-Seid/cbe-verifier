name: Security

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # Reports only vulnerabilities in code paths this module actually calls.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      # G304/G307 style findings are reviewed; the library only reads CBE responses.
      - run: gosec ./...
